<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spending Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1a1c20; --sub:#6b7280;
  --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; --border:#e5e7eb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1f2226; --text:#eef0f2; --sub:#9aa1ab;
    --accent:#5b8cff; --danger:#f87171; --ok:#4ade80; --border:#2c3036;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1f2226; --text:#eef0f2; --sub:#9aa1ab;
  --accent:#5b8cff; --danger:#f87171; --ok:#4ade80; --border:#2c3036;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:16px 16px calc(90px + env(safe-area-inset-bottom,0px)) 16px;
  max-width:520px; margin-left:auto; margin-right:auto;
}
h1{font-size:20px; margin:8px 0 4px 0;}
.sub{color:var(--sub); font-size:13px; margin-bottom:16px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px;}
.cat-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
.cat-row:last-child{border-bottom:none;}
.cat-name{font-weight:600;}
.cat-nums{text-align:right; font-size:13px; color:var(--sub);}
.bar-bg{background:var(--border); border-radius:6px; height:6px; margin-top:6px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); transition:width .3s;}
.bar-fill.over{background:var(--danger);}
form.entry{display:flex; flex-direction:column; gap:10px;}
select,input,button,textarea{
  font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); width:100%;
}
button{background:var(--accent); color:white; border:none; font-weight:600; cursor:pointer;}
button.secondary{background:transparent; color:var(--accent); border:1px solid var(--accent);}
.row2{display:flex; gap:10px;}
.row2>*{flex:1;}
.entry-list{max-height:260px; overflow-y:auto;}
.entry-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px;}
.entry-item:last-child{border-bottom:none;}
.entry-meta{color:var(--sub); font-size:12px;}
.del{color:var(--danger); background:none; border:none; width:auto; padding:4px 8px; font-size:18px;}
.tabbar{display:flex; gap:8px; margin-bottom:14px;}
.tab{flex:1; text-align:center; padding:10px; border-radius:10px; background:var(--card); border:1px solid var(--border); cursor:pointer; font-weight:600; color:var(--sub);}
.tab.active{color:white; background:var(--accent); border-color:var(--accent);}
.section{display:none;}
.section.active{display:block;}
.empty{color:var(--sub); text-align:center; padding:20px 0; font-size:14px;}
.footer-actions{display:flex; gap:10px; margin-top:6px;}
.total-line{display:flex; justify-content:space-between; font-weight:700; margin-top:4px; font-size:15px;}
</style>
</head>
<body>
<h1>Spending Tracker</h1>
<div class="sub" id="monthLabel">-</div>

<div class="tabbar">
  <div class="tab active" data-tab="log">Log</div>
  <div class="tab" data-tab="budgets">Budgets</div>
  <div class="tab" data-tab="history">History</div>
</div>

<div class="section active" id="tab-log">
  <div class="card">
    <div class="total-line"><span>Spent this month</span><span id="totalSpent">KES 0</span></div>
    <div class="total-line" style="font-weight:400;color:var(--sub);"><span>Remaining</span><span id="totalRemaining">KES 0</span></div>
  </div>
  <div class="card" id="catOverview"></div>
  <div class="card">
    <form class="entry" id="entryForm">
      <select id="entryCategory"></select>
      <div class="row2">
        <input id="entryAmount" type="number" inputmode="decimal" placeholder="Amount (KES)" min="0" step="1" required>
        <input id="entryDate" type="date" required>
      </div>
      <input id="entryNote" type="text" placeholder="Note (optional)">
      <button type="submit">Add expense</button>
    </form>
  </div>
</div>

<div class="section" id="tab-budgets">
  <div class="card">
    <div class="sub" style="margin-bottom:10px;">Set your monthly budget per category. Add new categories as needed.</div>
    <div id="budgetList"></div>
    <form class="entry" id="newCatForm" style="margin-top:12px;">
      <div class="row2">
        <input id="newCatName" type="text" placeholder="New category name">
        <input id="newCatBudget" type="number" placeholder="Budget" min="0">
      </div>
      <button type="submit" class="secondary">Add category</button>
    </form>
  </div>
</div>

<div class="section" id="tab-history">
  <div class="card">
    <div class="footer-actions">
      <button class="secondary" id="exportBtn">Export CSV</button>
      <button class="secondary" id="copyBtn">Copy CSV</button>
      <button class="secondary" id="newCycleBtn">New pay cycle starts today</button>
    </div>
  </div>
  <div class="card">
    <div class="entry-list" id="historyList"></div>
  </div>
</div>

<script>
let state = {
  cycleStart: null,
  categories: [
    { id: cid(), name: "Transport", budget: 3000 },
    { id: cid(), name: "Lunch", budget: 4000 },
    { id: cid(), name: "Airtime", budget: 1000 }
  ],
  entries: [] // {id, categoryId, amount, date, note}
};

function cid(){ return 'c' + Math.random().toString(36).slice(2,9); }
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function fmt(n){ return 'KES ' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }

const STORAGE_KEY = 'spending-tracker-data';

function init(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed && parsed.categories) state = parsed;
    }
  }catch(e){}
  if(!state.cycleStart){
    const d = new Date();
    state.cycleStart = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
    persist();
  }
  document.getElementById('entryDate').valueAsDate = new Date();
  updateMonthLabel();
  render();
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function updateMonthLabel(){
  const start = new Date(state.cycleStart+'T00:00:00');
  document.getElementById('monthLabel').textContent = 'Pay cycle since ' + start.toLocaleDateString(undefined,{day:'numeric', month:'short', year:'numeric'});
}

function render(){
  renderCategorySelect();
  renderOverview();
  renderBudgets();
  renderHistory();
}

function currentMonthEntries(){
  return state.entries.filter(e => e.date >= state.cycleStart);
}

function spentByCategory(catId){
  return currentMonthEntries().filter(e=>e.categoryId===catId).reduce((s,e)=>s+Number(e.amount),0);
}

function renderCategorySelect(){
  const sel = document.getElementById('entryCategory');
  sel.innerHTML = state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}

function renderOverview(){
  const box = document.getElementById('catOverview');
  if(state.categories.length===0){ box.innerHTML = '<div class="empty">No categories yet — add one in Budgets.</div>'; }
  else{
    box.innerHTML = state.categories.map(c=>{
      const spent = spentByCategory(c.id);
      const pct = c.budget>0 ? Math.min(100,(spent/c.budget)*100) : 0;
      const over = c.budget>0 && spent>c.budget;
      return `<div class="cat-row"><div style="flex:1;">
        <div class="cat-name">${escapeHtml(c.name)}</div>
        <div class="bar-bg"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      </div>
      <div class="cat-nums">${fmt(spent)} / ${fmt(c.budget)}</div>
      </div>`;
    }).join('');
  }
  const totalSpent = currentMonthEntries().reduce((s,e)=>s+Number(e.amount),0);
  const totalBudget = state.categories.reduce((s,c)=>s+Number(c.budget||0),0);
  document.getElementById('totalSpent').textContent = fmt(totalSpent);
  document.getElementById('totalRemaining').textContent = fmt(totalBudget-totalSpent);
}

function renderBudgets(){
  const box = document.getElementById('budgetList');
  if(state.categories.length===0){ box.innerHTML = '<div class="empty">No categories yet.</div>'; return; }
  box.innerHTML = state.categories.map(c=>`
    <div class="cat-row">
      <div class="cat-name" style="flex:1;">${escapeHtml(c.name)}</div>
      <input type="number" style="width:100px;" value="${c.budget}" data-catid="${c.id}" class="budgetInput">
      <button class="del" data-delcat="${c.id}" title="Delete category">&times;</button>
    </div>`).join('');
  box.querySelectorAll('.budgetInput').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const c = state.categories.find(c=>c.id===inp.dataset.catid);
      if(c){ c.budget = Number(inp.value)||0; persist(); render(); }
    });
  });
  box.querySelectorAll('[data-delcat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('Delete this category and its logged entries?')) return;
      const id = btn.dataset.delcat;
      state.categories = state.categories.filter(c=>c.id!==id);
      state.entries = state.entries.filter(e=>e.categoryId!==id);
      persist(); render();
    });
  });
}

function renderHistory(){
  const box = document.getElementById('historyList');
  const sorted = [...state.entries].sort((a,b)=> b.date.localeCompare(a.date));
  if(sorted.length===0){ box.innerHTML = '<div class="empty">No expenses logged yet.</div>'; return; }
  box.innerHTML = sorted.map(e=>{
    const cat = state.categories.find(c=>c.id===e.categoryId);
    return `<div class="entry-item">
      <div>
        <div>${escapeHtml(cat?cat.name:'—')}${e.note?' · '+escapeHtml(e.note):''}</div>
        <div class="entry-meta">${e.date}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <strong>${fmt(e.amount)}</strong>
        <button class="del" data-delentry="${e.id}">&times;</button>
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-delentry]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.entries = state.entries.filter(e=>e.id!==btn.dataset.delentry);
      persist(); render();
    });
  });
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

document.getElementById('entryForm').addEventListener('submit', (ev)=>{
  ev.preventDefault();
  const catId = document.getElementById('entryCategory').value;
  const amount = Number(document.getElementById('entryAmount').value);
  const date = document.getElementById('entryDate').value;
  const note = document.getElementById('entryNote').value.trim();
  if(!catId || !amount || !date) return;
  state.entries.push({ id: cid(), categoryId: catId, amount, date, note });
  document.getElementById('entryAmount').value='';
  document.getElementById('entryNote').value='';
  persist(); render();
});

document.getElementById('newCatForm').addEventListener('submit', (ev)=>{
  ev.preventDefault();
  const name = document.getElementById('newCatName').value.trim();
  const budget = Number(document.getElementById('newCatBudget').value)||0;
  if(!name) return;
  state.categories.push({ id: cid(), name, budget });
  document.getElementById('newCatName').value='';
  document.getElementById('newCatBudget').value='';
  persist(); render();
});

document.getElementById('newCycleBtn').addEventListener('click', ()=>{
  if(!confirm('Start a new pay cycle from today? Totals and bars reset to zero. All past entries stay in History.')) return;
  state.cycleStart = todayStr();
  persist(); updateMonthLabel(); render();
});

function buildCSV(){
  const rows = [['Date','Category','Amount','Note']];
  [...state.entries].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const cat = state.categories.find(c=>c.id===e.categoryId);
    rows.push([e.date, cat?cat.name:'', e.amount, (e.note||'').replace(/,/g,';')]);
  });
  return rows.map(r=>r.join(',')).join('\n');
}

function copyCSV(csv, btn){
  const original = btn.textContent;
  const done = ()=>{ btn.textContent = 'Copied!'; setTimeout(()=>{ btn.textContent = original; }, 2000); };
  const showBox = ()=>{
    let box = document.getElementById('csvFallback');
    if(!box){
      box = document.createElement('textarea');
      box.id = 'csvFallback';
      box.style.cssText = 'width:100%;height:160px;margin-top:10px;font-size:13px;';
      btn.parentNode.parentNode.appendChild(box);
    }
    box.value = csv;
    box.focus(); box.select();
    btn.textContent = 'Select all & copy below';
    setTimeout(()=>{ btn.textContent = original; }, 3000);
  };
  const legacy = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = csv; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? done() : showBox();
    }catch(e){ showBox(); }
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(csv).then(done).catch(legacy);
  } else { legacy(); }
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([buildCSV()], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'spending-'+todayStr()+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('copyBtn').addEventListener('click', (ev)=>{
  copyCSV(buildCSV(), ev.currentTarget);
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
  });
});

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){}
}

init();
</script>
</body>
</html>
